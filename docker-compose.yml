services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    volumes:
      - opencode-config:/root/.config/opencode
      - opencode-workspace:/workspace
    environment:
      HOST: "0.0.0.0"
      PORT: "4096"
    restart: unless-stopped
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-admin}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD}"
    depends_on:
      - opencode
    restart: unless-stopped
    networks:
      - internal

volumes:
  opencode-config:
  opencode-workspace:

networks:
  internal:
    driver: bridge
